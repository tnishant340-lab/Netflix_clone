
<!DOCTYPE html>
<html>
<head>
    <title>Online Shopping - Nishant Kumar</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f3eaff;
        }
        header {
            background: #563477;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .card {
            border: none;
            border-radius: 12px;
            height: 100%;
        }
        .card img {
            height: 170px;
            object-fit: contain;
            padding: 10px;
        }
        .cart {
            background: white;
            padding: 20px;
            border-radius: 12px;
        }
        h3 {
            color: #563477;
        }
        .btn-purple {
            background: #563477;
            color: white;
        }
        .btn-purple:hover {
            background: #30204f;
            color: white;
        }
    </style>
</head>

<body>

<header>
    <h2>Online Shopping Store</h2>
    <p>NISHANT KUMAR | 22515000091</p>
</header>

<div class="container my-4">
    <div class="row">

        <!-- Products -->
        <div class="col-md-8">
            <h3 class="mb-3">Our Products</h3>
            <div class="row" id="productList"></div>
        </div>

        <!-- Cart -->
        <div class="col-md-4">
            <div class="cart">
                <h3>Shopping Cart</h3>
                <div id="cartItems">Your cart is empty.</div>
                <hr>
                <h5>Grand Total: ₹<span id="total">0</span></h5>
            </div>
        </div>

    </div>
</div>

<script>
const products = [
    {
        id: 1,
        name: "Wireless Headphones",
        price: 2499,
        originalPrice: 3499,
        discount: 29,
        description: "Comfortable headphones with deep bass.",
        image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500",
        category: "Electronics",
        rating: 4.5,
        inStock: true
    },
    {
        id: 2,
        name: "Smart Watch",
        price: 1999,
        originalPrice: 2999,
        discount: 33,
        description: "Smartwatch for fitness and daily use.",
        image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500",
        category: "Accessories",
        rating: 4.2,
        inStock: true
    },
    {
        id: 3,
        name: "Running Shoes",
        price: 1799,
        originalPrice: 2499,
        discount: 28,
        description: "Lightweight shoes for daily workouts.",
        image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500",
        category: "Footwear",
        rating: 4.4,
        inStock: true
    },
    {
        id: 4,
        name: "Travel Backpack",
        price: 1299,
        originalPrice: 1999,
        discount: 35,
        description: "Spacious backpack for college and travel.",
        image: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=500",
        category: "Bags",
        rating: 4.3,
        inStock: true
    },
    {
        id: 5,
        name: "Digital Camera",
        price: 15999,
        originalPrice: 18999,
        discount: 16,
        description: "Capture your memorable moments.",
        image: "https://images.unsplash.com/photo-1516035069371-29a1b244cc32?w=500",
        category: "Electronics",
        rating: 4.6,
        inStock: true
    },
    {
        id: 6,
        name: "Sunglasses",
        price: 899,
        originalPrice: 1499,
        discount: 40,
        description: "Stylish sunglasses for everyday use.",
        image: "https://images.unsplash.com/photo-1511499767150-a48a237f0083?w=500",
        category: "Fashion",
        rating: 4.1,
        inStock: true
    },
    {
        id: 7,
        name: "Coffee Maker",
        price: 3499,
        originalPrice: 4499,
        discount: 22,
        description: "Make fresh coffee easily at home.",
        image: "https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=500",
        category: "Home Appliances",
        rating: 4.4,
        inStock: false
    }
];

let cart = [];

// Display products
function displayProducts() {
    let output = "";

    products.forEach(product => {
        output += `
        <div class="col-md-6 col-lg-4 mb-3">
            <div class="card shadow-sm">
                <img src="${product.image}" class="card-img-top">
                <div class="card-body">
                    <h5>${product.name}</h5>
                    <p>${product.description}</p>
                    <p>
                        <b>₹${product.price}</b>
                        <del>₹${product.originalPrice}</del>
                    </p>
                    <p class="text-success">${product.discount}% OFF</p>
                    <p>Rating: ⭐ ${product.rating}</p>
                    <button class="btn btn-purple w-100"
                        onclick="addToCart(${product.id})"
                        ${!product.inStock ? "disabled" : ""}>
                        ${product.inStock ? "Add to Cart" : "Out of Stock"}
                    </button>
                </div>
            </div>
        </div>`;
    });

    document.getElementById("productList").innerHTML = output;
}

// Add product to cart
function addToCart(id) {
    let product = products.find(p => p.id === id);

    if (!product.inStock) {
        alert("Product is out of stock!");
        return;
    }

    let item = cart.find(p => p.id === id);

    if (item) {
        item.quantity++;
    } else {
        cart.push({...product, quantity: 1});
    }

    displayCart();
}

// Display cart and calculate total
function displayCart() {
    let output = "";
    let total = 0;

    if (cart.length === 0) {
        output = "Your cart is empty.";
    }

    cart.forEach(item => {
        let subtotal = item.price * item.quantity;
        total += subtotal;

        output += `
        <div class="mb-3">
            <b>${item.name}</b>
            <p>Price: ₹${item.price}</p>
            <p>Quantity: ${item.quantity}</p>
            <p>Subtotal: ₹${subtotal}</p>
        </div>
        <hr>`;
    });

    document.getElementById("cartItems").innerHTML = output;
    document.getElementById("total").innerText = total;
}

displayProducts();
</script>

</body>
</html>
