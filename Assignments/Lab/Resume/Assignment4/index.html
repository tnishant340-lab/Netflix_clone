  `111<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShopDynamic</title>

  <!-- Bootstrap CSS and icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Our own CSS file -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar bg-white border-bottom">
    <div class="container-fluid px-4">
      <a class="navbar-brand fw-bold" href="#"><i class="bi bi-bag-fill"></i> ShopDynamic</a>
      <div class="d-flex align-items-center gap-3">
        <a href="#" class="nav-link">Home</a>
        <a href="#" class="nav-link">Shop</a>
        <a href="#" class="nav-link">About</a>
        <button class="btn position-relative" onclick="toggleCart()">
          <i class="bi bi-cart3 fs-5"></i>
          <span id="cartCount" class="badge rounded-pill bg-success position-absolute top-0 start-100 translate-middle">0</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- Page layout: products on the left, cart on the right -->
  <div class="page-layout">

    <!-- Product cards go here -->
    <main class="products-area p-4">
      <div class="row g-4" id="productList"></div>
    </main>

    <!-- Shopping cart (hidden until something is added) -->
    <aside id="cartSection" class="cart-area d-none">
      <div class="d-flex justify-content-between align-items-center p-3 border-bottom">
        <h5 class="m-0">Shopping Cart</h5>
        <button class="btn-close" onclick="toggleCart()"></button>
      </div>

      <div id="cartItems" class="cart-items p-3"></div>

      <div class="cart-footer p-3 border-top">
        <h6>Cart Total</h6>
        <div class="d-flex justify-content-between small mb-2">
          <span>Items:</span>
          <span id="totalItems">0</span>
        </div>
        <div class="grand-total d-flex justify-content-between mb-3">
          <span>Grand Total:</span>
          <span id="grandTotal">₹ 0</span>
        </div>
        <button class="btn btn-success w-100" onclick="checkout()">Proceed to Checkout</button>
      </div>
    </aside>

  </div>

  <!-- Bootstrap JS and our own JS file -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
