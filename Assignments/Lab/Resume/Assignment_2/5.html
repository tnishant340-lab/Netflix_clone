
<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>

    <style>
        body {
            font-family: Arial;
            background: #f3eaff;
        }

        .login {
            width: 350px;
            margin: 100px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px #aaa;
        }

        h2 {
            text-align: center;
            color: #563477;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #563477;
            color: white;
            border: none;
            cursor: pointer;
        }

        p {
            text-align: center;
        }
    </style>
</head>

<body>

<div class="login">

    <h2>Login Page</h2>

    <p><b>NISHANT KUMAR</b></p>
    <p>Student ID: 22515000091</p>

    <form>

        <label>Email</label>
        <input type="email" placeholder="Enter your email" required>

        <label>Password</label>
        <input type="password" placeholder="Enter your password" required>

        <button type="submit">Login</button>

        <p>
            Don't have an account?
            <a href="registration.html">Sign Up</a>
        </p>

    </form>

</div>

</body>
</html>
