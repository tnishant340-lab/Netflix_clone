
<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>

    <style>
        body {
            font-family: Arial;
            background: #f3eaff;
        }

        .form {
            width: 400px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        h2 {
            text-align: center;
            color: #563477;
        }

        input, select {
            margin: 8px 0 15px;
        }

        .text {
            width: 100%;
            padding: 9px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #563477;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="form">

    <h2>Registration Form</h2>

    <p><b>Name:</b> NISHANT KUMAR</p>
    <p><b>Student ID:</b> 22515000091</p>

    <form>

        <label>Full Name</label>
        <input type="text" class="text" placeholder="Enter your name" required>

        <label>Email</label>
        <input type="email" class="text" placeholder="Enter your email" required>

        <label>Password</label>
        <input type="password" class="text" placeholder="Enter password" required>

        <label>Gender</label><br>
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female
        <input type="radio" name="gender"> Other

        <br><br>

        <label>Hobbies</label><br>
        <input type="checkbox"> Reading
        <input type="checkbox"> Sports
        <input type="checkbox"> Music

        <br><br>

        <label>Choose Course</label>

        <select class="text" required>
            <option value="">Select Course</option>
            <option>B.Tech</option>
            <option>BCA</option>
            <option>MCA</option>
            <option>BBA</option>
        </select>

        <button type="submit">Register</button>

    </form>

</div>

</body>
</html>
