
<!DOCTYPE html>
<html>
<head>
    <title>Theme Changer</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 100px;
            background: #f3eaff;
            color: #30204f;
        }

        .dark {
            background: #222;
            color: white;
        }

        button {
            padding: 12px 25px;
            margin: 10px;
            cursor: pointer;
            background: #563477;
            color: white;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <h1>Theme Changer</h1>

    <h3>NISHANT KUMAR</h3>
    <p>Student ID: 22515000091</p>

    <p>Click the button to change the website theme.</p>

    <button onclick="changeTheme()">Change Theme</button>

    <script>
        function changeTheme() {
            document.body.classList.toggle("dark");
        }
    </script>

</body>
</html>
